openapi: 3.1.0
info:
  title: PYX Gate API
  version: "1.0.0"
  description: |
    API pública da PYX Gate para criação de cobranças Pix e cartão,
    consulta de pagamentos e recebimento de eventos via webhook.

    Autenticação por chave de API (`Authorization: Bearer sk_...`). Toda
    transação criada com uma chave `sk_test_...` roda em **modo teste**:
    nunca move dinheiro real, nunca chama a adquirente de verdade — a
    confirmação é feita manualmente via `/v1/test/payments/{id}/pay` (ou
    `/fail`). Chaves `sk_live_...` processam pagamentos reais.
  contact:
    name: PYX Gate
servers:
  - url: https://pyxgate-api.onrender.com/v1
    description: Produção (domínio próprio api.pyxgate.com ainda não configurado — use esta URL). Não há sandbox separado — use uma chave sk_test_... nesta mesma URL para modo teste.
  - url: http://localhost:3000/v1
    description: Ambiente local de desenvolvimento (só relevante para contribuir com o código da PYX Gate)

security:
  - bearerAuth: []

tags:
  - name: Account
    description: Dados da conta associada à chave de API.
  - name: Payments
    description: Criação e consulta de cobranças (Pix e cartão).
  - name: Card Authentication
    description: Autenticação 3DS para pagamentos com cartão (só sellers com adquirente Zendry).
  - name: Refunds
    description: Estornos. Endpoint da Zendry (única adquirente suportada) ainda não confirmado com o suporte deles.
  - name: Test Mode
    description: Simulação de pagamentos em modo teste.
  - name: Webhook Endpoints
    description: Cadastro de endpoints que recebem eventos da PYX Gate.

paths:
  /account:
    get:
      operationId: getAccount
      tags: [Account]
      summary: Retorna a conta (merchant) associada à chave de API usada.
      responses:
        "200":
          description: Conta autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments:
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Cria uma cobrança (Pix ou cartão).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            examples:
              pix:
                summary: Cobrança Pix
                value:
                  amount: 1990
                  currency: BRL
                  payment_method: pix
                  customer:
                    name: "Maria Compradora"
                    email: "maria@example.com"
                    document: "39053344705"
                  metadata:
                    order_id: "ORD-123"
              card:
                summary: Cobrança no cartão (após rodar o 3DS no navegador do comprador)
                value:
                  amount: 15000
                  currency: BRL
                  payment_method: card
                  customer:
                    name: "Maria Compradora"
                    email: "maria@example.com"
                    document: "39053344705"
                  card:
                    number: "4242424242424242"
                    holder_name: "MARIA COMPRADORA"
                    expiration_date: "122029"
                    security_code: "123"
                    installments: 1
                  threeds_data:
                    session_id: "abc123"
      responses:
        "201":
          description: Pagamento criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listPayments
      tags: [Payments]
      summary: Lista pagamentos (paginado), escopado ao modo (test/live) da chave usada.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: status
          in: query
          description: Filtra por status público (`pending`, `paid`, `failed`).
          schema: { type: string, enum: [pending, paid, failed] }
        - name: created_after
          in: query
          description: ISO 8601. Filtra pagamentos criados após esta data.
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          description: ISO 8601. Filtra pagamentos criados antes desta data.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Lista paginada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Consulta um pagamento pelo id público (pay_...).
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Pagamento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /card_authentications/token:
    get:
      operationId: getCardAuthenticationToken
      tags: [Card Authentication]
      summary: Devolve o token necessário pro desafio 3DS no navegador do comprador.
      description: |
        Chame do SEU backend (nunca do navegador — usa sua chave secreta) e
        repasse o `token` retornado pro seu frontend, que o usa em
        `ZendrySDKThreeds.init_threeds({ token, amount, payment_form, ... })`
        — o SDK client-side (`https://cdn.zendry.com/v1/zendry-sdk-threeds.min.js`)
        cria a sessão 3DS e roda o desafio sozinho, direto no navegador do
        comprador contra a Zendry (não passa pelo backend da PYX Gate).

        **Atenção**: esse token fica exposto no navegador do SEU comprador —
        é o mesmo Bearer que autentica toda a comunicação da PYX Gate com a
        Zendry, não escopado só pra 3DS. Ver `docs/guia-cartao.md` pro fluxo
        completo, incluindo o schema de `payment_form` (não documentado
        publicamente pela Zendry, confirmado por sondagem empírica).

        Só funciona para sellers com adquirente `zendry`.
      responses:
        "200":
          description: Token obtido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          description: Seller não usa adquirente Zendry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Falha ao obter o token na Zendry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /refunds:
    post:
      operationId: createRefund
      tags: [Refunds]
      summary: Estorna um pagamento com status "paid".
      description: |
        Reverte o ledger de dupla-entrada e o saldo retido/disponível do
        seller — mas só DEPOIS de confirmar o estorno na adquirente. Hoje a
        chamada sempre falha com `acquirer_refund_unsupported` ou
        `acquirer_refund_failed` — o endpoint de estorno da Zendry (única
        adquirente suportada) nunca foi confirmado com o suporte deles, e
        preferimos isso a fingir que o estorno aconteceu.

        Só estorno TOTAL por enquanto (sem valor parcial). Só pagamentos
        `mode: "live"` com status `paid` podem ser estornados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: { type: string, example: "pay_654a1f2b3c4d5e6f70718293" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Pagamento estornado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: Adquirente do seller não suporta estorno (ex. zendry, ainda não confirmado com o suporte deles).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: A adquirente recusou ou falhou ao processar o estorno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /test/payments/{id}/pay:
    post:
      operationId: simulatePaymentPaid
      tags: [Test Mode]
      summary: Simula a aprovação de um pagamento em modo teste.
      description: |
        Só funciona para pagamentos com `mode: "test"` e `status: "pending"`,
        autenticado com uma chave `sk_test_...`. Dispara o evento de webhook
        `payment.paid`.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Pagamento marcado como pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /test/payments/{id}/fail:
    post:
      operationId: simulatePaymentFailed
      tags: [Test Mode]
      summary: Simula a falha de um pagamento em modo teste.
      description: |
        Mesmas regras de `/test/payments/{id}/pay`, mas marca como `failed`
        e dispara `payment.failed`.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Pagamento marcado como falho.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      tags: [Webhook Endpoints]
      summary: Cadastra um endpoint para receber eventos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
            examples:
              default:
                value:
                  url: "https://seusite.com/webhooks/pyxgate"
                  events: ["payment.paid", "payment.failed"]
      responses:
        "201":
          description: Endpoint criado. O campo `secret` (whsec_...) só é útil aqui e na listagem — guarde para verificar assinaturas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/InvalidRequest"
    get:
      operationId: listWebhookEndpoints
      tags: [Webhook Endpoints]
      summary: Lista os endpoints cadastrados.
      responses:
        "200":
          description: Lista de endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"

  /webhook_endpoints/{id}:
    patch:
      operationId: updateWebhookEndpoint
      tags: [Webhook Endpoints]
      summary: Atualiza url, eventos ou ativa/desativa um endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: "we_654a1..." }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Endpoint atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhook Endpoints]
      summary: Remove um endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removido.
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "sk_live_... / sk_test_..."
      description: |
        Secret key gerada no dashboard (Desenvolvedores → Chaves de API).
        Publishable keys (`pk_...`) não autenticam nenhum endpoint desta API
        — são só para uso client-side em SDKs futuros.

        Chaves de API carregam escopo `*` (acesso a todos os endpoints).
        Para acesso granular, use OAuth 2.1 (`oauth2` abaixo).

    oauth2:
      type: oauth2
      description: |
        Usado pelo servidor MCP e por aplicações de terceiros que agem em
        nome do seller. Diferente da chave de API, o token é granular
        (escopos escolhidos no consentimento), tem prazo (1h, com refresh
        rotativo de 30 dias) e fica preso ao ambiente (test/live) escolhido
        na autorização — o modo não é parâmetro de requisição.

        O registro do cliente é dinâmico (RFC 7591) e PKCE S256 é
        obrigatório. Ver `docs/mcp.md`.
      flows:
        authorizationCode:
          authorizationUrl: https://pyxgate-api.onrender.com/oauth/authorize
          tokenUrl: https://pyxgate-api.onrender.com/oauth/token
          refreshUrl: https://pyxgate-api.onrender.com/oauth/token
          scopes:
            account:read: Ver dados da conta e o ambiente ativo
            payments:read: Consultar e listar pagamentos
            payments:write: Criar cobranças Pix
            webhooks:read: Ver endpoints de webhook
            webhooks:write: Criar, alterar e remover endpoints de webhook
            test:write: Simular pagamentos em modo teste

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Garante que reenviar a mesma requisição (rede instável, retry do seu
        lado) não crie uma cobrança duplicada. Mesma chave + mesmo payload
        retorna a resposta original. Mesma chave + payload diferente é
        rejeitado com 400. TTL de 24h.
      schema:
        type: string
        example: "pedido-8f3a21"
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "pay_654a1f2b3c4d5e6f70718293"

  responses:
    InvalidRequest:
      description: Payload inválido ou requisição malformada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Chave de API ausente, inválida ou revogada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado (ou não pertence à conta autenticada).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, card_error, api_error]
            code:
              type: string
              example: invalid_api_key
            message:
              type: string
            param:
              type: string
              nullable: true

    Account:
      type: object
      properties:
        id: { type: string, example: "acct_654a1f2b3c4d5e6f70718293" }
        name: { type: string }
        email: { type: string }
        mode: { type: string, enum: [test, live] }
        kyc_status: { type: string }

    Customer:
      type: object
      required: [name]
      description: |
        `email` e `document` são obrigatórios para `payment_method: card`.
        Para `payment_method: pix`, informe `email` + `document`, OU `phone`
        (Pix só com telefone exige a conta autorizada pela PYX Gate — fale
        com o suporte; sem essa liberação, `phone` sozinho retorna
        `pix_phone_only_not_authorized`).
      properties:
        name: { type: string }
        email: { type: string, format: email }
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), somente números.
        phone: { type: string }

    Card:
      type: object
      required: [number, holder_name, expiration_date, security_code]
      properties:
        number: { type: string, description: "Número completo do cartão." }
        holder_name: { type: string }
        expiration_date: { type: string, description: "Formato MMyyyy, ex.: 122029." }
        security_code: { type: string }
        installments: { type: integer, default: 1, minimum: 1, maximum: 14 }

    CreatePaymentRequest:
      type: object
      required: [amount, payment_method, customer]
      properties:
        amount:
          type: integer
          description: Valor em centavos.
          example: 1990
        currency:
          type: string
          enum: [BRL]
          default: BRL
        payment_method:
          type: string
          enum: [pix, card]
        description: { type: string }
        metadata:
          type: object
          additionalProperties: true
        customer:
          $ref: "#/components/schemas/Customer"
        card:
          $ref: "#/components/schemas/Card"
        threeds_data:
          type: object
          description: |
            Obrigatório quando payment_method é "card". Dados de autenticação
            3DS calculados pelo SDK Zendry no navegador do comprador — ver
            guia-cartao.md. Bag genérico chave/valor.
          additionalProperties:
            type: string

    Payment:
      type: object
      properties:
        id: { type: string, example: "pay_654a1f2b3c4d5e6f70718293" }
        object: { type: string, example: payment }
        amount: { type: integer, description: "Centavos." }
        fee: { type: integer, description: "Centavos." }
        net_amount: { type: integer, description: "Centavos." }
        currency: { type: string, example: BRL }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        payment_method: { type: string, enum: [pix, card, boleto] }
        mode: { type: string, enum: [test, live] }
        customer:
          $ref: "#/components/schemas/Customer"
        metadata:
          type: object
          additionalProperties: true
        qr_code:
          type: string
          description: Payload copia-e-cola do Pix (quando payment_method=pix).
        qr_code_base64:
          type: string
          description: QR code em base64 (quando payment_method=pix).
        card:
          type: object
          properties:
            last4: { type: string }
            brand: { type: string }
            authorization_code: { type: string }
        created:
          type: integer
          description: Unix timestamp (segundos).
        refund:
          type: object
          description: Presente só quando status é "refunded".
          properties:
            reason: { type: string }
            refunded_at: { type: integer, description: "Unix timestamp (segundos)." }

    PaymentList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        has_more: { type: boolean }

    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: Deve usar https:// em produção.
        events:
          type: array
          items:
            type: string
            enum: ["*", payment.created, payment.paid, payment.failed, payment.expired, refund.succeeded]

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, example: "we_654a1f2b3c4d5e6f70718293" }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        secret:
          type: string
          description: "whsec_... — use para verificar a assinatura PYX-Signature."
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
